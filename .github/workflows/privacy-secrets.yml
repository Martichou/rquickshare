# Shared repository privacy baseline. Application dependencies are unchanged.
# Documentation: https://github.com/edithatogo/repository-standards/blob/main/docs/privacy-secrets-standard.md
# Presidio runs in isolated Python 3.12 because its current release excludes 3.15.
# Existing repository-specific privacy and secret checks remain independent.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: ["master"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '34 4 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Personal-identifier detection profile
        type: choice
        options:
          - repository
          - sensitive
        default: repository

permissions:
  contents: read

concurrency:
  group: privacy-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan with Presidio and Gitleaks
        uses: edithatogo/repository-standards/.github/actions/privacy-secrets@985503bc8eae58e7d6ef36a6e5427d0077e0193c
        with:
          profile: ${{ inputs.profile || 'repository' }}

